name: Build

on:
  workflow_call:

jobs:
  image:
    name: Bootable images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc-aarch64-linux-gnu \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 ovmf \
            e2fsprogs ntfs-3g
      - name: Build images
        run: make images
      - name: Show toolchain
        run: |
          cc --version | head -1
          clang --version | head -1
          qemu-system-x86_64 --version | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: finte-pre-abi
          path: |
            build/kernel64.elf
            build/finte-bios.img
      - name: Run host and core checks
        run: |
          make test
          ./build/finte selfcheck
      - name: Run x86 process ABI test
        run: make abi-test
      - name: Run polled NVMe test
        run: make nvme-test
      - name: Run xHCI HID/storage test
        run: make xhci-test
      - name: Run arm64 boot test
        run: make arm64-test
      - name: Run arm64 UEFI test
        run: make arm64-uefi-test
      - name: Run arm64 virtio disk test
        run: make arm64-disk-test
      - name: Run arm64 UEFI disk test
        run: make arm64-uefi-disk-test
      - uses: actions/upload-artifact@v4
        with:
          name: finte-images
          path: |
            build/finte-x86_64.img
            build/finte-x86_64.iso
            build/finte-arm64.img
            build/finte-arm64.iso
          if-no-files-found: error

  windows:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        shell: cmd
        run: build-win.bat
      - name: Test
        shell: cmd
        run: build\finte.exe test
      - uses: actions/upload-artifact@v4
        with:
          name: finte-exe
          path: build\finte.exe
          if-no-files-found: error
