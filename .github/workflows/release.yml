name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Find previous release
        id: previous
        run: |
          tag=$(git tag -l 'v*' --sort=-creatordate | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build release notes
        run: sh tools/release_notes.sh "${{ steps.previous.outputs.tag }}" release-notes.md "$GITHUB_REF_NAME"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Finte v${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: |
            dist/finte-image/finte.img
            dist/finte-exe/finte.exe
          fail_on_unmatched_files: true
